<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>صفحه یافت نشد | حسابیست</title>
<link rel="stylesheet" href="style.css">

<!-- Performance: Preload critical font (Regular weight for hero text) -->
<link rel="preload" as="font" type="font/ttf" crossorigin href="https://fonts.gstatic.com/s/vazirmatn/v16/Dxx78j6PP2D_kU2muijPEe1n2vVbfJRklWgzORc.ttf">

<!-- Performance: DNS prefetch for external resources -->
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://open.er-api.com">

<!-- Fonts: Vazirmatn with display=optional for zero CLS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=optional" rel="stylesheet">

<!-- Canonical for 404 page -->
<link rel="canonical" href="https://hesabist-app.ir/404.html">

<!-- SEO -->
<meta name="description" content="صفحه درخواستی یافت نشد - حسابیست | بیش از ۴۰ ابزار محاسباتی رایگان">
<meta name="robots" content="noindex, follow">

<!-- Open Graph -->
<meta property="og:title" content="صفحه یافت نشد | حسابیست">
<meta property="og:description" content="صفحه درخواستی وجود ندارد. به ابزارهای محاسباتی رایگان بروید.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hesabist-app.ir/404.html">
<meta property="og:image" content="https://hesabist-app.ir/icon-512.svg">
<meta property="og:locale" content="fa_IR">

<!-- Structured Data: WebSite with SearchAction -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "url": "https://hesabist-app.ir/",
  "name": "حسابیست",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://hesabist-app.ir/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
</head>
<body>
<div class="container" style="text-align:center;padding:60px 20px;max-width:600px;margin:0 auto;">
<svg width="120" height="120" viewBox="0 0 120 120" style="margin-bottom:24px;opacity:0.3;">
<circle cx="60" cy="60" r="50" fill="none" stroke="var(--primary)" stroke-width="4" stroke-dasharray="314" stroke-dashoffset="78"/>
<text x="60" y="72" font-size="48" text-anchor="middle" fill="var(--primary)">404</text>
</svg>

<h1 style="font-size:2rem;margin-bottom:12px;color:var(--text);">صفحه یافت نشد</h1>
<p style="color:var(--text-muted);font-size:1.1rem;margin-bottom:32px;line-height:1.6;">
متاسفیم! صفحه‌ای که به دنبالش هستید وجود ندارد یا آدرس اشتباه است.
</p>

<!-- Search Box -->
<div style="margin-bottom:32px;">
<form onsubmit="event.preventDefault(); searchTools(this.query.value);" style="display:flex;gap:8px;max-width:400px;margin:0 auto;">
<input type="text" name="query" id="search404" placeholder="ابزار مورد نظر را جستجو کنید..." style="flex:1;padding:14px 18px;border-radius:12px;border:2px solid var(--bg);background:var(--bg);color:var(--text);font-size:1rem;font-family:inherit;outline:none;">
<button type="submit" style="padding:14px 28px;border-radius:12px;border:none;background:var(--primary);color:#fff;font-size:1rem;cursor:pointer;font-weight:bold;">جستجو</button>
</form>
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:24px;text-align:right;">
<a href="https://hesabist-app.ir/" class="tool-card" style="text-decoration:none;display:block;background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--border);transition:all 0.2s;" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='var(--shadow)'" onmouseout="this.style.transform='';this.style.boxShadow=''">
<span style="font-size:2rem;">🏠</span>
<h3 style="margin:8px 0 0;color:var(--text);">صفحه اصلی</h3>
</a>

<a href="https://hesabist-app.ir/bmi.html" class="tool-card" style="text-decoration:none;display:block;background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--border);transition:all 0.2s;" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='var(--shadow)'" onmouseout="this.style.transform='';this.style.boxShadow=''">
<span style="font-size:2rem;">⚖️</span>
<h3 style="margin:8px 0 0;color:var(--text);">شاخص BMI</h3>
</a>

<a href="https://hesabist-app.ir/loan.html" class="tool-card" style="text-decoration:none;display:block;background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--border);transition:all 0.2s;" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='var(--shadow)'" onmouseout="this.style.transform='';this.style.boxShadow=''">
<span style="font-size:2rem;">🏦</span>
<h3 style="margin:8px 0 0;color:var(--text);">محاسبه وام</h3>
</a>

<a href="https://hesabist-app.ir/discount.html" class="tool-card" style="text-decoration:none;display:block;background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--border);transition:all 0.2s;" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='var(--shadow)'" onmouseout="this.style.transform='';this.style.boxShadow=''">
<span style="font-size:2rem;">💰</span>
<h3 style="margin:8px 0 0;color:var(--text);">محاسبه تخفیف</h3>
</a>

<a href="https://hesabist-app.ir/base64.html" class="tool-card" style="text-decoration:none;display:block;background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--border);transition:all 0.2s;" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='var(--shadow)'" onmouseout="this.style.transform='';this.style.boxShadow=''">
<span style="font-size:2rem;">🔐</span>
<h3 style="margin:8px 0 0;color:var(--text);">Base64</h3>
</a>

<a href="https://hesabist-app.ir/qrGen.html" class="tool-card" style="text-decoration:none;display:block;background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--border);transition:all 0.2s;" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='var(--shadow)'" onmouseout="this.style.transform='';this.style.boxShadow=''">
<span style="font-size:2rem;">📱</span>
<h3 style="margin:8px 0 0;color:var(--text);">QR Code</h3>
</a>
</div>

<div style="margin-top:40px;padding-top:24px;border-top:1px solid var(--border);color:var(--text-muted);font-size:0.9rem;">
<p>💡 <strong>پیشنهاد:</strong> از منوی بالا یا جستجوی بالا ابزار مورد نظر را پیدا کنید.</p>
<p style="margin-top:8px;">یا به <a href="https://hesabist-app.ir/" style="color:var(--primary);">صفحه اصلی حسابیست</a> برگردید.</p>
</div>
</div>

<script>
function searchTools(q) {
if (!q.trim()) return;
const url = 'https://hesabist-app.ir/?q=' + encodeURIComponent(q.trim());
window.location.href = url;
}

// Simple client-side redirects for common typos/misspellings
(function() {
  var path = window.location.pathname.toLowerCase();
  var redirects = {
    '/bmi-calculator.html': '/bmi.html',
    '/loan-calculator.html': '/loan.html',
    '/discount-calculator.html': '/discount.html',

    '/og-preview.html': '/ogPreview.html',
    '/price-calculator.html': '/priceCalc.html',
    '/real-estate-calculator.html': '/realstate.html',
    '/eidi-calculator.html': '/eidi.html',
    '/vat-calculator.html': '/vat.html',
    '/age-calculator.html': '/age.html',
    '/water-intake.html': '/water.html',
    '/ideal-weight.html': '/ideals.html',
    '/calorie-calculator.html': '/calorie.html',

  };

    window.location.replace('https://hesabist-app.ir' + redirects[path]);
  }
})();
</script>
</body>
</html>
