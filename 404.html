.e404-wrap {

.e404-search {

  display: flex;
  gap: 8px;

}

.e404-search input {
  flex: 1;
  min-width: 0;
  padding: 14px 16px;
  border-radius: 14px;
  border: 2px solid var(--bg);
  background: var(--bg);
  color: var(--text);
  font-size: 1rem;
  font-family: inherit;

  -webkit-appearance: none;
}

.e404-search button {

  padding: 14px 22px;
  border-radius: 14px;
  border: none;
  background: var(--primary);
  color: #fff;
  font-size: 1rem;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.e404-grid {
  width: 100%;
  max-width: 400px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.e404-card {
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border-radius: 14px;
  padding: 14px;
  border: 1px solid var(--border);
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.e404-card:active {
  transform: scale(0.97);
  opacity: 0.8;
}

.e404-card-icon {
  font-size: 1.6rem;
  flex-shrink: 0;
}

.e404-card-text {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
  text-align: right;
  line-height: 1.3;
}

.e404-home {
  width: 100%;
  max-width: 400px;
  margin-top: 16px;
  padding: 16px;
  border-radius: 14px;
  border: none;
  background: var(--primary);
  color: #fff;
  font-size: 1.05rem;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.e404-home:active {
  opacity: 0.8;
}

@media (min-width: 480px) {
